<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Zyrex SMP - Server Statistics & Status</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo i {
            font-size: 2rem;
            color: var(--accent-color);
        }

        .logo h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .server-ip-box {
            background: #0f172a;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .server-ip-box:hover {
            border-color: var(--accent-color);
        }

        .lang-select {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-color);
            cursor: pointer;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
        }

        .lang-select:hover {
            border-color: var(--accent-color);
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .card-info h3 {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .card-info p {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .status-online { color: var(--success); }
        .status-offline { color: var(--danger); }

        .dashboard-banner {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid #334155;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .dashboard-banner i.fa-chart-pie {
            font-size: 4rem;
            color: var(--accent-color);
            background: rgba(56, 189, 248, 0.1);
            padding: 25px;
            border-radius: 50%;
        }

        .dashboard-banner h2 {
            font-size: 2rem;
        }

        .dashboard-banner p {
            color: var(--text-secondary);
            max-width: 600px;
            line-height: 1.5;
        }

            background-color: var(--accent-color);
            color: #0f172a;
            padding: 14px 28px;
            border-radius: 10px;
