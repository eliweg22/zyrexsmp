<!DOCTYPE html>
<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Zyrex SMP - Server Statistics & Status</title>

        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;

            --text-color: #f8fafc;

            --success: #22c55e;
            --danger: #ef4444;
        }

        * {

            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            align-items: center;

            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo i {
            font-size: 2rem;
            color: var(--accent-color);
        }

        .logo h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .header-controls {

            align-items: center;
            gap: 1rem;
        }

            border-radius: 8px;
            border: 1px solid #334155;

            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .server-ip-box:hover {
            border-color: var(--accent-color);
        }

        .lang-select {

            border: 1px solid #334155;
            border-radius: 8px;

            outline: none;
            transition: all 0.2s;
        }

        .lang-select:hover {
            border-color: var(--accent-color);
        }

            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
