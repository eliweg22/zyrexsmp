<script>
function copyToClipboard(text, buttonElement) {
    navigator.clipboard.writeText(text).then(() => {
        const span = buttonElement.querySelector('span');
        const originalText = span.textContent;
        span.textContent = 'Kopiert!';
        setTimeout(() => {
            span.textContent = originalText;
        }, 2000);
    }).catch(err => {
        console.error('Fehler beim Kopieren: ', err);
    });
}
</script>

    <!-- INTERACTIVE JAVASCRIPT -->
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const menuIcon = document.getElementById('menu-icon');
        const navMenu = document.getElementById('nav-menu');
        let isOpen = false;

        // Toggle Menu Function
        function toggleMenu() {
            isOpen = !isOpen;

            if (isOpen) {
                // Open Menu
                navMenu.classList.remove('hidden');
                setTimeout(() => {
                    navMenu.classList.remove('opacity-0');
                }, 10);
                
                // Change icon to white cross (Close)
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-xmark', 'text-white', 'rotate-90');
            } else {
                // Close Menu
                navMenu.classList.add('opacity-0');
                setTimeout(() => {
                    navMenu.classList.add('hidden');
                }, 300);

                // Change icon back to 3 stripes (Hamburger)
                menuIcon.classList.remove('fa-xmark', 'text-white', 'rotate-90');
                menuIcon.classList.add('fa-bars');
            }
        }

        menuBtn.addEventListener('click', toggleMenu);

        // Close menu on pressing Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isOpen) {
                toggleMenu();
            }
        });

        /* =======================================================
           SERVER STATUS API LOGIK (FALIXNODES PROXY SUPPORT)
        ======================================================= */
        const QUERY_IP = "5.9.89.83:41468";
        
        function fetchServerStatus() {
            const statusEl = document.getElementById('server-status');
            const playersEl = document.getElementById('player-count');
            const versionEl = document.getElementById('server-version');

            // API Abfrage über CORS Proxy (allorigins), um Browser-Blockaden bei Falix-Ports zu vermeiden
            const apiUrl = "https://api.mcstatus.io/v2/status/java/" + QUERY_IP;
            const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(apiUrl);

            fetch(proxyUrl)
                .then(response => {
                    if (!response.ok) throw new Error("Netzwerk-Antwort war nicht ok");
                    return response.json();
                })
                .then(data => {
                    if (data && data.online) {
                        statusEl.innerText = "ONLINE";
                        statusEl.className = "text-lg font-bold text-green-400";
                        
                        const onlinePlayers = data.players ? data.players.online : 0;
                        const maxPlayers = data.players ? data.players.max : 0;
                        playersEl.innerText = `${onlinePlayers} / ${maxPlayers}`;

                        const verName = (data.version && data.version.name_clean) ? data.version.name_clean : (data.version ? data.version.name_raw : "1.20.x");
                        versionEl.innerText = verName;
                    } else {
                        // Fallback-Abfrage falls mcstatus Offline meldet
                        fetchFallback();
                    }
                })
                .catch(err => {
                    console.warn("Proxy/MCStatus Fehler, versuche Fallback API:", err);
                    fetchFallback();
                });
        }

        function fetchFallback() {
            const statusEl = document.getElementById('server-status');
            const playersEl = document.getElementById('player-count');
            const versionEl = document.getElementById('server-version');

            fetch("https://api.mcsrvstat.us/2/" + QUERY_IP)
                .then(res => res.json())
                .then(data => {
                    if (data && data.online) {
                        statusEl.innerText = "ONLINE";
                        statusEl.className = "text-lg font-bold text-green-400";
                        playersEl.innerText = `${data.players.online} / ${data.players.max}`;
                        versionEl.innerText = data.version || "1.20.x";
                    } else {
                        statusEl.innerText = "OFFLINE";
                        statusEl.className = "text-lg font-bold text-red-500";
                        playersEl.innerText = "0 / 0";
                        versionEl.innerText = "-";
                    }
                })
                .catch(err => {
                    console.error("Fallback API Fehler:", err);
                    statusEl.innerText = "OFFLINE";
                    statusEl.className = "text-lg font-bold text-red-500";
                    playersEl.innerText = "0 / 0";
                    versionEl.innerText = "-";
                });
        }

        // Status Refresh Button Action
        const refreshBtn = document.getElementById('refresh-btn');
        const refreshIcon = document.getElementById('refresh-icon');

        refreshBtn.addEventListener('click', () => {
            refreshIcon.classList.add('fa-spin');
            fetchServerStatus();
            setTimeout(() => {
                refreshIcon.classList.remove('fa-spin');
            }, 800);
        });

        // Initialer Abruf & Intervall-Timer (alle 30 Sekunden)
        fetchServerStatus();
        setInterval(fetchServerStatus, 30000);
    </script>
